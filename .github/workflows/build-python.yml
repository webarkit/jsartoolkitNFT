name: Build and Test Python Bindings

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libjpeg9

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy setuptools wheel pybind11 pytest pytest-asyncio pillow

    - name: Update submodules
      run: git submodule update --init

    - name: Build the Python bindings
      run: |
        cd python-bindings
        python setup.py bdist_wheel && pip install dist/*.whl

    - name: Test the build
      run: |
        cd python-bindings
        python example.py

    - name: Run unit tests
      run: npm run python-tests

    - name: Test the wheel checks
      run: python -m pytest .github/scripts/test_check_wheel.py

  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        # cmake is needed by setup.py to build the bundled zlib.
        # libjpeg-9c is downloaded and built from source by setup.py
        # (same path as on Linux), so we only need autotools, which
        # ships with the macos-15 runner by default.
        brew install cmake

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy setuptools wheel pybind11 pytest pytest-asyncio pillow

    - name: Update submodules
      run: git submodule update --init

    - name: Build the Python bindings
      run: |
        cd python-bindings
        python setup.py bdist_wheel && pip install dist/*.whl

    - name: Test the build
      run: |
        cd python-bindings
        python example.py

    - name: Run unit tests
      run: npm run python-tests

    # As publish-python.yml does: delocate bundles the libjpeg that setup.py
    # built, then check_wheel.py requires every binary to have every
    # architecture the tag claims. A universal extension with an arm64-only
    # libjpeg fails here (#653).
    - name: Check the repaired wheel's architectures
      run: |
        set -euo pipefail
        python -m pip install delocate
        cd python-bindings
        delocate-wheel -w repaired/ -v dist/*.whl
        for whl in repaired/*.whl; do
          python "$GITHUB_WORKSPACE/.github/scripts/check_wheel.py" "$whl"
        done

  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache vcpkg
      uses: actions/cache@v5
      with:
        path: |
          vcpkg
          !vcpkg/.git
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      shell: pwsh
      run: |
        if (-not (Test-Path vcpkg)) {
          git clone https://github.com/microsoft/vcpkg.git
        }
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install libjpeg-turbo
      run: .\vcpkg\vcpkg install libjpeg-turbo

    - name: Install pthreads
      run: .\vcpkg\vcpkg install pthreads

    - name: Add vcpkg to path
      shell: bash
      run: echo "vcpkg/installed/x64-windows/bin" >> $GITHUB_PATH

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy setuptools wheel pybind11 pytest pytest-asyncio pillow

    - name: Update submodules
      run: git submodule update --init

    - name: Build the Python bindings
      shell: pwsh
      run: |
        cd python-bindings
        python setup.py bdist_wheel
        pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
        

    - name: Test the build
      run: |
        cd python-bindings
        python example.py

    - name: Run unit tests
      run: npm run python-tests