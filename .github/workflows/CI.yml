name: CI
on:
  - push
  - pull_request

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  tests:
    runs-on: ubuntu-24.04  # Upgrade to Ubuntu 24.04
    name: Node.js CI
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install Chrome for Karma
        shell: bash
        # Not `apt-get install chromium-browser`: that package is snap-backed,
        # and the Snapcraft CDN returns 5xx often enough to redden unrelated
        # PRs (#602). A three-attempt retry was tried first and all three
        # attempts failed against a sustained outage, so the dependency itself
        # is the problem, not the flakiness.
        #
        # Google's .deb comes straight from dl.google.com with no snap in the
        # path. Playwright's Chromium is not an option here: it launches but
        # never captures under Karma, timing out after 60s per attempt.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          for attempt in 1 2 3; do
            if curl -fsSL -o "$tmp/chrome.deb" \
                 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not download Chrome after 3 attempts"
              exit 1
            fi
            echo "::warning::Chrome download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          # apt itself needs the same treatment: a mirror hiccup during
          # `update` or dependency resolution fails the job just as hard as a
          # failed download, and that is the whole point of #602.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y "$tmp/chrome.deb"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install Chrome after 3 attempts"
              exit 1
            fi
            echo "::warning::Chrome install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          google-chrome-stable --version

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Build Docs
        run: npm run docs