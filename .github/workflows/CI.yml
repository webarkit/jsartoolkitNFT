name: CI
on:
  - push
  - pull_request

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  tests:
    runs-on: ubuntu-24.04  # Upgrade to Ubuntu 24.04
    name: Node.js CI
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        shell: bash
        # Playwright's Chromium is the only browser the tests need. Its download,
        # and the apt packages --with-deps pulls in, can hit a transient CDN or
        # mirror failure (#602), so retry before failing the job.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install Playwright Chromium after 3 attempts"
              exit 1
            fi
            echo "::warning::Playwright install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      - name: Tests
        run: npm test

      - name: Build Docs
        run: npm run docs