name: CI
on:
  - push
  - pull_request

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  tests:
    runs-on: ubuntu-24.04  # Upgrade to Ubuntu 24.04
    name: Node.js CI
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install
        run: npm ci

      # Fails on any file prettier would change (#733). Runs before the browser
      # install so that a formatting slip fails fast.
      - name: Check formatting
        run: npm run format-check

      - name: Install Playwright Chromium
        shell: bash
        # Playwright's Chromium is the only browser the tests need. Its download,
        # and the apt packages --with-deps pulls in, can hit a transient CDN or
        # mirror failure (#602), so retry before failing the job.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install Playwright Chromium after 3 attempts"
              exit 1
            fi
            echo "::warning::Playwright install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

      # `npm test` with coverage on the browser suite: the same two suites, but
      # Vitest writes coverage/lcov.info for src/ (#580). Keep this in step with
      # the `test` script in package.json. The Node suite tests the dist/
      # bundles, not src/, so it adds no coverage.
      - name: Tests
        run: |
          npm run test:coverage
          npm run test:node

      # Report only: a failed upload does not fail the job, and codecov.yml
      # makes Codecov's statuses informational (#580).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

      - name: Build Docs
        run: npm run docs