name: CI
on:
  - push
  - pull_request

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  tests:
    runs-on: ubuntu-24.04  # Upgrade to Ubuntu 24.04
    name: Node.js CI
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install ChromiumHeadless
        shell: bash
        run: |
          # Bounded retry: the apt package is snap-backed, and the Snapcraft CDN
          # returns transient 5xx that fail the whole job with nothing wrong in
          # the code (see #602). publish.yml has carried this guard since the
          # 1.10.2 release; CI.yml was left without it and still fails this way.
          set +e
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y chromium-browser
            if [ $? -eq 0 ]; then
              echo "Chromium installed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Chromium install attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Chromium install failed after 3 attempts"
          exit 1

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - uses: actions/cache@v5
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test

      - name: Build Docs
        run: npm run docs