name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'    # e.g. 1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. 1.2.3)
        required: true

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install ChromiumHeadless
        shell: bash
        run: |
          # Bounded retry: the snap-backed apt package has failed on transient
          # Snapcraft assertion-fetch timeouts (see #602). A tag-triggered
          # release cannot simply be re-run, so absorb short-lived failures.
          set +e
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y chromium-browser
            if [ $? -eq 0 ]; then
              echo "Chromium installed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Chromium install attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Chromium install failed after 3 attempts"
          exit 1

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: |
          # For public scoped packages add --access public
          # For private packages omit --access or use --access restricted
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

