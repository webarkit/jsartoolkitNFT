name: Publish to npm

on:
  push:
    tags:
      # Digit-anchored so this only fires for npm releases. A bare '*.*.*'
      # also matched tags like 'python-0.0.13', because '*' matches '-' --
      # so a Python release would have triggered an npm publish too.
      # Python releases are tagged 'python/<version>' (see publish-python.yml).
      - '[0-9]*.[0-9]*.[0-9]*'    # e.g. 1.2.3
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to publish, e.g. 1.2.3. THIS PERFORMS A REAL RELEASE to
          the npm registry -- it is not a rehearsal. Must be an existing tag;
          a branch name or commit SHA is rejected.
        required: true

permissions:
  contents: read
  id-token: write   # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On a tag push github.ref is already the tag. On workflow_dispatch it
          # is the default branch, so the `tag` input has to be applied here or a
          # manual run publishes master rather than the tag it names (#619).
          # That matters most when re-running after a failed tagged release.
          #
          # The input is resolved under refs/tags/ rather than passed through
          # bare. `tag` is a free-form string, so a bare value would let a branch
          # name or a commit SHA resolve and be published as a release. Prefixing
          # makes checkout fail loudly on anything that is not an existing tag.
          ref: >-
            ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Chrome for Karma
        shell: bash
        # Was the snap-backed `chromium-browser` apt package behind a bounded
        # retry. The retry is not enough: during a sustained Snapcraft CDN
        # outage all three attempts fail (#602), and this is the workflow that
        # publishes releases -- a tag-triggered run failing on a browser
        # download is the worst possible time for it.
        #
        # Google's .deb comes straight from dl.google.com with no snap in the
        # path. The retry is kept for genuinely transient download failures.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          for attempt in 1 2 3; do
            if curl -fsSL -o "$tmp/chrome.deb" \
                 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not download Chrome after 3 attempts"
              exit 1
            fi
            echo "::warning::Chrome download attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          # apt itself needs the same treatment: a mirror hiccup during
          # `update` or dependency resolution fails the job just as hard as a
          # failed download, and that is the whole point of #602.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y "$tmp/chrome.deb"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not install Chrome after 3 attempts"
              exit 1
            fi
            echo "::warning::Chrome install attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          google-chrome-stable --version

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
        env:
          CI: true

      # This replaces the old `npm whoami` canary, which cannot work under trusted
      # publishing: OIDC is not a logged-in session, so there is no user to report.
      #
      # Be clear about what this does and does not cover. It exercises packing and
      # the manifest, so a bad `files`/`exports` entry or a broken package.json
      # still fails before anything reaches the registry. It does NOT verify
      # credentials -- npm mints the OIDC token during publish itself, so there is
      # no pre-flight auth check to make. Authentication problems now surface at
      # the publish step rather than before it (#620).
      - name: Verify the package builds (dry run)
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        # Authenticates via npm Trusted Publishing (OIDC) using the id-token
        # permission granted above -- no NODE_AUTH_TOKEN, nothing to rotate, and
        # nothing that expires. Requires the trusted publisher to be configured on
        # npmjs.com for this repository and this workflow filename, and npm >=
        # 11.5.1, which Node 24 provides via .nvmrc (it bundles npm 11.16+).
        #
        # For public scoped packages add --access public
        # For private packages omit --access or use --access restricted
        run: npm publish --provenance --access public

