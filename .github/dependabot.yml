# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note: GitHub reads this file from the default branch (master) only. Changes
# here take effect once they reach master, not when they land on dev.

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: "daily"
    # Open pull requests against `dev`. `master` is reserved for stable
    # releases, so dependency updates must not target it — see CONTRIBUTING.md.
    target-branch: "dev"
    ignore:
      # The project runs on Node 24 (.nvmrc and CI), so @types/node stays on
      # 24.x: a newer major describes APIs that Node 24 does not have. Minor and
      # patch updates still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
