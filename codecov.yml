# Coverage is reported, not enforced (#580): Codecov's project and patch
# statuses never fail a PR. The report covers src/ only (see vitest.config.ts),
# without the worker entries src/tracker/worker/host_*.ts. The Node classes stay
# in it at 0 % on purpose: tests/node/ runs them through the dist/ bundles,
# outside istanbul, and excluding them would hide that gap (#762, after #734).
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
